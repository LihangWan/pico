<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980">
  <defs>
    <style>
      .title { font: 700 30px 'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', Arial, sans-serif; fill: #1f2937; }
      .subtitle { font: 500 15px 'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', Arial, sans-serif; fill: #4b5563; }
      .section { font: 700 20px 'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', Arial, sans-serif; fill: #111827; }
      .box-title { font: 700 16px 'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', Arial, sans-serif; fill: #111827; }
      .box-text { font: 400 13px 'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', Arial, sans-serif; fill: #374151; }
      .small { font: 400 12px 'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', Arial, sans-serif; fill: #4b5563; }
      .card { fill: #ffffff; stroke: #d1d5db; stroke-width: 1.5; rx: 14; ry: 14; }
      .group { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; rx: 18; ry: 18; }
      .arrow { stroke: #475569; stroke-width: 2.2; fill: none; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0,0 10,4 0,8" fill="#475569" />
    </marker>
  </defs>

  <rect x="0" y="0" width="1400" height="980" fill="#f3f4f6" />

  <text x="50" y="55" class="title">Pico 项目架构图（面试精简版）</text>
  <text x="50" y="82" class="subtitle">主线：CLI 装配 - Agent 运行时循环 - 持久化与恢复 - Benchmark / Metrics</text>

  <rect x="40" y="120" width="1320" height="185" class="group" />
  <text x="60" y="150" class="section">1. 启动与装配层</text>

  <rect x="70" y="180" width="250" height="90" class="card" />
  <text x="90" y="208" class="box-title">CLI 入口</text>
  <text x="90" y="230" class="box-text">pico/cli.py</text>
  <text x="90" y="250" class="box-text">解析参数，区分 one-shot / REPL</text>

  <rect x="390" y="180" width="260" height="90" class="card" />
  <text x="410" y="208" class="box-title">工作区与配置</text>
  <text x="410" y="230" class="box-text">workspace.py + config.py</text>
  <text x="410" y="250" class="box-text">构建 repo 上下文，加载 .env</text>

  <rect x="720" y="180" width="250" height="90" class="card" />
  <text x="740" y="208" class="box-title">模型接入</text>
  <text x="740" y="230" class="box-text">models.py</text>
  <text x="740" y="250" class="box-text">Fake / Ollama / OpenAI / Anthropic</text>

  <rect x="1040" y="180" width="280" height="90" class="card" />
  <text x="1060" y="208" class="box-title">Agent 装配</text>
  <text x="1060" y="230" class="box-text">build_agent() -&gt; Pico / Pico.from_session()</text>
  <text x="1060" y="250" class="box-text">把 workspace、model、session 组装起来</text>

  <path d="M320 225 L390 225" class="arrow" />
  <path d="M650 225 L720 225" class="arrow" />
  <path d="M970 225 L1040 225" class="arrow" />

  <rect x="40" y="335" width="1320" height="340" class="group" />
  <text x="60" y="365" class="section">2. Agent 运行时主循环</text>

  <rect x="70" y="400" width="260" height="220" class="card" />
  <text x="90" y="428" class="box-title">Pico Runtime</text>
  <text x="90" y="450" class="box-text">runtime.py :: Pico.ask()</text>
  <text x="90" y="475" class="box-text">主循环：</text>
  <text x="90" y="495" class="box-text">1. 组 prompt</text>
  <text x="90" y="515" class="box-text">2. 调模型</text>
  <text x="90" y="535" class="box-text">3. 解析 tool / final / retry</text>
  <text x="90" y="555" class="box-text">4. 执行工具</text>
  <text x="90" y="575" class="box-text">5. 更新 history / memory / checkpoint</text>
  <text x="90" y="595" class="box-text">6. 写 trace / report</text>

  <rect x="380" y="400" width="280" height="220" class="card" />
  <text x="400" y="428" class="box-title">上下文管理</text>
  <text x="400" y="450" class="box-text">context_manager.py</text>
  <text x="400" y="475" class="box-text">Prompt 五层：</text>
  <text x="400" y="495" class="box-text">- prefix</text>
  <text x="400" y="515" class="box-text">- memory</text>
  <text x="400" y="535" class="box-text">- relevant_memory</text>
  <text x="400" y="555" class="box-text">- history</text>
  <text x="400" y="575" class="box-text">- current_request</text>
  <text x="400" y="600" class="box-text">按预算裁剪，优先保留当前请求</text>

  <rect x="710" y="400" width="280" height="220" class="card" />
  <text x="730" y="428" class="box-title">记忆系统</text>
  <text x="730" y="450" class="box-text">memory.py</text>
  <text x="730" y="475" class="box-text">分层：</text>
  <text x="730" y="495" class="box-text">- working：任务摘要、最近文件</text>
  <text x="730" y="515" class="box-text">- file_summaries：文件短摘要 + freshness</text>
  <text x="730" y="535" class="box-text">- episodic_notes：过程笔记</text>
  <text x="730" y="555" class="box-text">- durable memory：长期事实</text>
  <text x="730" y="580" class="box-text">相关记忆召回后进入 prompt</text>

  <rect x="1040" y="400" width="280" height="220" class="card" />
  <text x="1060" y="428" class="box-title">工具层</text>
  <text x="1060" y="450" class="box-text">tools.py</text>
  <text x="1060" y="475" class="box-text">能力：</text>
  <text x="1060" y="495" class="box-text">- list_files / read_file / search</text>
  <text x="1060" y="515" class="box-text">- run_shell / write_file / patch_file</text>
  <text x="1060" y="535" class="box-text">- delegate</text>
  <text x="1060" y="560" class="box-text">边界：</text>
  <text x="1060" y="580" class="box-text">参数校验、路径约束、审批、重复调用拦截</text>

  <path d="M330 510 L380 510" class="arrow" />
  <path d="M660 510 L710 510" class="arrow" />
  <path d="M990 510 L1040 510" class="arrow" />

  <rect x="40" y="705" width="720" height="220" class="group" />
  <text x="60" y="735" class="section">3. 持久化与恢复</text>

  <rect x="70" y="770" width="300" height="120" class="card" />
  <text x="90" y="798" class="box-title">会话状态</text>
  <text x="90" y="820" class="box-text">.pico/sessions/&lt;session_id&gt;.json</text>
  <text x="90" y="845" class="box-text">- history</text>
  <text x="90" y="865" class="box-text">- memory</text>
  <text x="90" y="885" class="box-text">- checkpoints / runtime_identity / resume_state</text>

  <rect x="420" y="770" width="300" height="120" class="card" />
  <text x="440" y="798" class="box-title">长期记忆文件</text>
  <text x="440" y="820" class="box-text">.pico/memory/MEMORY.md</text>
  <text x="440" y="840" class="box-text">.pico/memory/topics/*.md</text>
  <text x="440" y="865" class="box-text">按 topic 保存项目约定、决策、依赖、偏好</text>

  <rect x="800" y="705" width="560" height="220" class="group" />
  <text x="820" y="735" class="section">4. 运行工件与评测闭环</text>

  <rect x="830" y="770" width="240" height="120" class="card" />
  <text x="850" y="798" class="box-title">Run Artifacts</text>
  <text x="850" y="820" class="box-text">.pico/runs/&lt;run_id&gt;/</text>
  <text x="850" y="845" class="box-text">- task_state.json</text>
  <text x="850" y="865" class="box-text">- trace.jsonl</text>
  <text x="850" y="885" class="box-text">- report.json</text>

  <rect x="1110" y="770" width="220" height="120" class="card" />
  <text x="1130" y="798" class="box-title">评测系统</text>
  <text x="1130" y="820" class="box-text">evaluator.py + metrics.py</text>
  <text x="1130" y="845" class="box-text">- 固定 benchmark</text>
  <text x="1130" y="865" class="box-text">- verifier 判卷</text>
  <text x="1130" y="885" class="box-text">- context / memory / recovery 实验</text>

  <text x="50" y="955" class="small">适合面试讲解的主线：CLI 装配出 Pico - Pico 通过 runtime 驱动模型与工具循环 - memory/context 负责长期状态与 prompt 编排 - session/checkpoint/run artifacts 负责恢复与复盘 - evaluator/metrics 负责验证系统是否真的变好。</text>
</svg>
