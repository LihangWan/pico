<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1180" viewBox="0 0 1600 1180">
  <defs>
    <style>
      .title { font: 700 32px 'Segoe UI', Arial, sans-serif; fill: #1f2937; }
      .subtitle { font: 500 15px 'Segoe UI', Arial, sans-serif; fill: #4b5563; }
      .section { font: 700 20px 'Segoe UI', Arial, sans-serif; fill: #111827; }
      .box-title { font: 700 16px 'Segoe UI', Arial, sans-serif; fill: #111827; }
      .box-text { font: 400 13px 'Segoe UI', Arial, sans-serif; fill: #374151; }
      .small { font: 400 12px 'Segoe UI', Arial, sans-serif; fill: #4b5563; }
      .card { fill: #ffffff; stroke: #d1d5db; stroke-width: 1.5; rx: 14; ry: 14; }
      .group { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; rx: 18; ry: 18; }
      .arrow { stroke: #475569; stroke-width: 2.2; fill: none; marker-end: url(#arrowhead); }
      .dashed { stroke-dasharray: 8 6; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0,0 10,4 0,8" fill="#475569" />
    </marker>
  </defs>

  <rect x="0" y="0" width="1600" height="1180" fill="#f3f4f6" />

  <text x="60" y="56" class="title">Pico Project Architecture</text>
  <text x="60" y="84" class="subtitle">CLI - runtime loop - memory/context - persistence - benchmark/metrics</text>

  <rect x="40" y="110" width="1520" height="270" class="group" />
  <text x="60" y="142" class="section">1. Startup And Assembly</text>

  <rect x="70" y="170" width="250" height="160" class="card" />
  <text x="90" y="198" class="box-title">CLI</text>
  <text x="90" y="220" class="box-text">pico/cli.py</text>
  <text x="90" y="245" class="box-text">- parse args</text>
  <text x="90" y="265" class="box-text">- one-shot / REPL split</text>
  <text x="90" y="285" class="box-text">- provider / model / resume</text>
  <text x="90" y="305" class="box-text">- approval / max_steps</text>

  <rect x="380" y="170" width="250" height="160" class="card" />
  <text x="400" y="198" class="box-title">Workspace + Config</text>
  <text x="400" y="220" class="box-text">workspace.py / config.py</text>
  <text x="400" y="245" class="box-text">- cwd / repo_root</text>
  <text x="400" y="265" class="box-text">- git status / recent_commits</text>
  <text x="400" y="285" class="box-text">- AGENTS.md / README.md</text>
  <text x="400" y="305" class="box-text">- load .env from workspace repo</text>

  <rect x="690" y="170" width="250" height="160" class="card" />
  <text x="710" y="198" class="box-title">Model Client</text>
  <text x="710" y="220" class="box-text">models.py</text>
  <text x="710" y="245" class="box-text">- FakeModelClient</text>
  <text x="710" y="265" class="box-text">- Ollama</text>
  <text x="710" y="285" class="box-text">- OpenAI-compatible</text>
  <text x="710" y="305" class="box-text">- Anthropic-compatible / DeepSeek</text>

  <rect x="1000" y="170" width="250" height="160" class="card" />
  <text x="1020" y="198" class="box-title">Session Store</text>
  <text x="1020" y="220" class="box-text">runtime.py :: SessionStore</text>
  <text x="1020" y="245" class="box-text">- save/load session JSON</text>
  <text x="1020" y="265" class="box-text">- latest() resume helper</text>
  <text x="1020" y="285" class="box-text">- .pico/sessions/&lt;id&gt;.json</text>

  <rect x="1310" y="170" width="210" height="160" class="card" />
  <text x="1330" y="198" class="box-title">Build Agent</text>
  <text x="1330" y="220" class="box-text">cli.py :: build_agent()</text>
  <text x="1330" y="245" class="box-text">- new Pico(...)</text>
  <text x="1330" y="265" class="box-text">or Pico.from_session(...)</text>
  <text x="1330" y="285" class="box-text">- wires all dependencies</text>

  <path d="M320 250 L380 250" class="arrow" />
  <path d="M630 250 L690 250" class="arrow" />
  <path d="M940 250 L1000 250" class="arrow" />
  <path d="M1250 250 L1310 250" class="arrow" />

  <rect x="40" y="410" width="1520" height="430" class="group" />
  <text x="60" y="442" class="section">2. Runtime Control Loop</text>

  <rect x="70" y="480" width="260" height="300" class="card" />
  <text x="90" y="508" class="box-title">Pico Runtime</text>
  <text x="90" y="530" class="box-text">runtime.py :: Pico.ask()</text>
  <text x="90" y="555" class="box-text">Loop:</text>
  <text x="90" y="575" class="box-text">1. build prompt</text>
  <text x="90" y="595" class="box-text">2. model complete()</text>
  <text x="90" y="615" class="box-text">3. parse tool/final/retry</text>
  <text x="90" y="635" class="box-text">4. run tool if needed</text>
  <text x="90" y="655" class="box-text">5. update memory/history</text>
  <text x="90" y="675" class="box-text">6. checkpoint / trace / report</text>
  <text x="90" y="700" class="box-text">Stops by:</text>
  <text x="90" y="720" class="box-text">- final answer</text>
  <text x="90" y="740" class="box-text">- step limit</text>
  <text x="90" y="760" class="box-text">- retry limit</text>

  <rect x="370" y="480" width="270" height="140" class="card" />
  <text x="390" y="508" class="box-title">Context Manager</text>
  <text x="390" y="530" class="box-text">context_manager.py</text>
  <text x="390" y="555" class="box-text">Prompt sections:</text>
  <text x="390" y="575" class="box-text">- prefix</text>
  <text x="390" y="595" class="box-text">- memory</text>
  <text x="390" y="615" class="box-text">- relevant_memory</text>
  <text x="390" y="635" class="box-text">- history</text>
  <text x="390" y="655" class="box-text">- current_request</text>

  <rect x="370" y="650" width="270" height="130" class="card" />
  <text x="390" y="678" class="box-title">Prompt Reduction Policy</text>
  <text x="390" y="700" class="box-text">- char budgets per section</text>
  <text x="390" y="720" class="box-text">- reduction order:</text>
  <text x="410" y="740" class="box-text">relevant_memory -&gt; history</text>
  <text x="410" y="760" class="box-text">-&gt; memory -&gt; prefix</text>

  <rect x="680" y="480" width="280" height="300" class="card" />
  <text x="700" y="508" class="box-title">Layered Memory</text>
  <text x="700" y="530" class="box-text">memory.py</text>
  <text x="700" y="555" class="box-text">Working:</text>
  <text x="720" y="575" class="box-text">- task_summary</text>
  <text x="720" y="595" class="box-text">- recent_files</text>
  <text x="700" y="620" class="box-text">Episodic:</text>
  <text x="720" y="640" class="box-text">- read_file summaries</text>
  <text x="720" y="660" class="box-text">- process notes</text>
  <text x="700" y="685" class="box-text">File summaries:</text>
  <text x="720" y="705" class="box-text">- per path + freshness hash</text>
  <text x="700" y="730" class="box-text">Durable memory:</text>
  <text x="720" y="750" class="box-text">- project conventions</text>
  <text x="720" y="770" class="box-text">- decisions / dependencies / preferences</text>

  <rect x="1000" y="480" width="250" height="300" class="card" />
  <text x="1020" y="508" class="box-title">Tool Registry</text>
  <text x="1020" y="530" class="box-text">tools.py</text>
  <text x="1020" y="555" class="box-text">- list_files</text>
  <text x="1020" y="575" class="box-text">- read_file</text>
  <text x="1020" y="595" class="box-text">- search</text>
  <text x="1020" y="615" class="box-text">- run_shell</text>
  <text x="1020" y="635" class="box-text">- write_file</text>
  <text x="1020" y="655" class="box-text">- patch_file</text>
  <text x="1020" y="675" class="box-text">- delegate</text>
  <text x="1020" y="700" class="box-text">Guards:</text>
  <text x="1040" y="720" class="box-text">- path boundary</text>
  <text x="1040" y="740" class="box-text">- approval for risky tools</text>
  <text x="1040" y="760" class="box-text">- repeated call rejection</text>

  <rect x="1290" y="480" width="230" height="300" class="card" />
  <text x="1310" y="508" class="box-title">Task State</text>
  <text x="1310" y="530" class="box-text">task_state.py</text>
  <text x="1310" y="555" class="box-text">- run_id / task_id</text>
  <text x="1310" y="575" class="box-text">- status / stop_reason</text>
  <text x="1310" y="595" class="box-text">- attempts</text>
  <text x="1310" y="615" class="box-text">- tool_steps</text>
  <text x="1310" y="635" class="box-text">- final_answer</text>
  <text x="1310" y="660" class="box-text">Checkpoint trigger points:</text>
  <text x="1330" y="680" class="box-text">- tool_executed</text>
  <text x="1330" y="700" class="box-text">- context_reduction</text>
  <text x="1330" y="720" class="box-text">- freshness_mismatch</text>
  <text x="1330" y="740" class="box-text">- workspace_mismatch</text>
  <text x="1330" y="760" class="box-text">- run_finished / stop_reason</text>

  <path d="M330 560 L370 560" class="arrow" />
  <path d="M640 555 L680 555" class="arrow" />
  <path d="M960 630 L1000 630" class="arrow" />
  <path d="M1250 630 L1290 630" class="arrow" />
  <path d="M1170 455 L1170 480" class="arrow dashed" />
  <path d="M820 455 L820 480" class="arrow dashed" />
  <path d="M505 455 L505 480" class="arrow dashed" />

  <rect x="40" y="870" width="940" height="250" class="group" />
  <text x="60" y="902" class="section">3. Persistence And Recovery</text>

  <rect x="70" y="940" width="280" height="130" class="card" />
  <text x="90" y="968" class="box-title">Session Persistence</text>
  <text x="90" y="990" class="box-text">runtime.py :: SessionStore</text>
  <text x="90" y="1015" class="box-text">.pico/sessions/&lt;session_id&gt;.json</text>
  <text x="90" y="1035" class="box-text">- history</text>
  <text x="90" y="1055" class="box-text">- memory</text>
  <text x="90" y="1075" class="box-text">- checkpoints / runtime_identity / resume_state</text>

  <rect x="390" y="940" width="280" height="130" class="card" />
  <text x="410" y="968" class="box-title">Durable Memory Files</text>
  <text x="410" y="990" class="box-text">.pico/memory/MEMORY.md</text>
  <text x="410" y="1010" class="box-text">.pico/memory/topics/*.md</text>
  <text x="410" y="1035" class="box-text">- explicit long-term facts only</text>
  <text x="410" y="1055" class="box-text">- dedupe + same-subject overwrite</text>

  <rect x="710" y="940" width="240" height="130" class="card" />
  <text x="730" y="968" class="box-title">Resume Validation</text>
  <text x="730" y="990" class="box-text">runtime.py :: evaluate_resume_state()</text>
  <text x="730" y="1015" class="box-text">- checkpoint schema</text>
  <text x="730" y="1035" class="box-text">- file freshness</text>
  <text x="730" y="1055" class="box-text">- runtime identity mismatch</text>

  <rect x="1020" y="870" width="540" height="250" class="group" />
  <text x="1040" y="902" class="section">4. Run Artifacts And Evaluation</text>

  <rect x="1050" y="940" width="230" height="130" class="card" />
  <text x="1070" y="968" class="box-title">Run Artifacts</text>
  <text x="1070" y="990" class="box-text">run_store.py</text>
  <text x="1070" y="1015" class="box-text">.pico/runs/&lt;run_id&gt;/</text>
  <text x="1070" y="1035" class="box-text">- task_state.json</text>
  <text x="1070" y="1055" class="box-text">- trace.jsonl / report.json</text>

  <rect x="1310" y="940" width="220" height="130" class="card" />
  <text x="1330" y="968" class="box-title">Benchmark + Metrics</text>
  <text x="1330" y="990" class="box-text">evaluator.py / metrics.py</text>
  <text x="1330" y="1015" class="box-text">- fixed benchmark tasks</text>
  <text x="1330" y="1035" class="box-text">- verifier-based judging</text>
  <text x="1330" y="1055" class="box-text">- context / memory / recovery ablations</text>

  <path d="M350 1005 L390 1005" class="arrow" />
  <path d="M670 1005 L710 1005" class="arrow" />
  <path d="M950 1005 L1050 1005" class="arrow" />
  <path d="M1280 1005 L1310 1005" class="arrow" />

  <text x="60" y="1150" class="small">Generated from repository structure and code paths in pico/cli.py, runtime.py, tools.py, memory.py, context_manager.py, evaluator.py and metrics.py.</text>
</svg>
